<!DOCTYPE html>
<html dir="rtl" lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>{{ action }} کمپین</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Vazirmatn', Tahoma, sans-serif;
            background: #f1f5f9;
            padding: 16px;
            color: #1e293b;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            max-width: 500px;
            width: 100%;
            margin: 0 auto;
            background: white;
            padding: 24px;
            border-radius: 24px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.06);
        }
        h1 {
            font-weight: 800;
            font-size: 22px;
            color: #1a2940;
            text-align: center;
            margin-bottom: 4px;
        }
        h1 span {
            color: #d4af37;
        }
        label {
            display: block;
            margin-top: 16px;
            font-weight: 600;
            color: #1e293b;
            font-size: 14px;
        }
        input, textarea {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #e2e8f0;
            border-radius: 14px;
            font-size: 15px;
            font-family: 'Vazirmatn', sans-serif;
            box-sizing: border-box;
            margin-top: 6px;
            background: #f8fafc;
            transition: all 0.15s ease;
        }
        input:focus, textarea:focus {
            outline: none;
            border-color: #d4af37;
            background: white;
            box-shadow: 0 0 0 4px rgba(212, 175, 55, 0.1);
        }
        textarea {
            resize: vertical;
            min-height: 80px;
        }
        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 10px;
        }
        .checkbox-group input[type="checkbox"] {
            width: 20px;
            height: 20px;
            margin-top: 0;
            accent-color: #d4af37;
        }
        .checkbox-group label {
            margin-top: 0;
            font-weight: 500;
            font-size: 14px;
        }
        .btn {
            width: 100%;
            padding: 14px;
            background: #1a2940;
            color: white;
            border: none;
            border-radius: 16px;
            font-size: 17px;
            font-weight: 700;
            font-family: 'Vazirmatn', sans-serif;
            margin-top: 20px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(26, 41, 64, 0.15);
        }
        .btn:hover {
            background: #0f1a2b;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(26, 41, 64, 0.2);
        }
        .btn-secondary {
            background: #d4af37;
            box-shadow: none;
        }
        .btn-secondary:hover {
            background: #c09e2e;
        }
        .back-link {
            display: inline-block;
            margin-top: 14px;
            color: #64748b;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: 0.15s ease;
        }
        .back-link:hover {
            color: #1a2940;
        }
        .alert {
            padding: 12px 16px;
            border-radius: 12px;
            margin: 12px 0;
            font-size: 14px;
            font-weight: 500;
        }
        .alert-success {
            background: #ecfdf5;
            color: #0d9488;
            border-right: 4px solid #0d9488;
        }
        .alert-danger {
            background: #fef2f2;
            color: #dc2626;
            border-right: 4px solid #dc2626;
        }
        @media (max-width: 600px) {
            body { padding: 10px; }
            .container { padding: 16px; border-radius: 18px; }
            h1 { font-size: 19px; }
            input, textarea { font-size: 14px; padding: 10px 12px; }
            .btn { font-size: 15px; padding: 12px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>{{ action }} <span>کمپین</span></h1>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <div class="alert alert-{{ category }}">{{ message }}</div>
            {% endfor %}
        {% endwith %}

        <form method="POST">
            <label>عنوان</label>
            <input type="text" name="title" value="{{ campaign.title if campaign else '' }}" required>

            <label>توضیحات</label>
            <textarea name="description">{{ campaign.description if campaign else '' }}</textarea>

            <label>مبلغ هدف (اختیاری)</label>
            <input type="number" name="target_amount" value="{{ campaign.target_amount if campaign else '' }}">

            <div class="checkbox-group">
                <input type="checkbox" name="is_active" {% if not campaign or campaign.is_active %}checked{% endif %}>
                <label>فعال باشد</label>
            </div>

            <button type="submit" class="btn">💾 ذخیره</button>
        </form>

        <a href="{{ url_for('admin_campaigns') }}" class="back-link">← بازگشت به لیست کمپین‌ها</a>
    </div>
</body>
</html>
