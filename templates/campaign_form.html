<!DOCTYPE html>
<html dir="rtl" lang="fa">
<head>
    <meta charset="UTF-8">
    <title>{{ action }} کمپین</title>
    <style>
        body { font-family: Tahoma; background: #ecf0f1; padding: 20px; }
        .container { max-width: 500px; margin: 0 auto; background: white; padding: 25px; border-radius: 16px; }
        h1 { color: #2c3e50; }
        label { display: block; margin-top: 15px; font-weight: bold; }
        input, textarea { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; margin-top: 5px; }
        .btn { background: #27ae60; color: white; padding: 12px; border: none; border-radius: 8px; width: 100%; cursor: pointer; margin-top: 20px; }
        .btn:hover { background: #219a52; }
        .alert { padding: 10px; border-radius: 6px; margin: 10px 0; }
        .alert-danger { background: #f8d7da; color: #721c24; }
        a { display: inline-block; margin-top: 10px; color: #7f8c8d; }
        .checkbox-label { display: flex; align-items: center; gap: 10px; }
        .checkbox-label input { width: auto; }
    </style>
</head>
<body>
    <div class="container">
        <h1>{{ action }} کمپین</h1>
        
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <div class="alert alert-{{ category }}">{{ message }}</div>
            {% endfor %}
        {% endwith %}

        <form method="POST">
            <label>عنوان</label>
            <input type="text" name="title" value="{{ campaign.title if campaign else '' }}" required>

            <label>توضیحات</label>
            <textarea name="description" rows="3">{{ campaign.description if campaign else '' }}</textarea>

            <label>مبلغ هدف (اختیاری)</label>
            <input type="number" name="target_amount" value="{{ campaign.target_amount if campaign else '' }}">

            <label class="checkbox-label">
                <input type="checkbox" name="is_active" {% if not campaign or campaign.is_active %}checked{% endif %}> فعال باشد
            </label>

            <button type="submit" class="btn">ذخیره</button>
        </form>
        <a href="/admin/campaigns">← بازگشت به لیست کمپین‌ها</a>
    </div>
</body>
</html>
