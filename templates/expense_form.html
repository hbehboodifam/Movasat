<!DOCTYPE html>
<html dir="rtl" lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>{{ action }} خرج</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Vazirmatn', Tahoma, sans-serif;
            background: #f1f5f9;
            padding: 16px;
            color: #1e293b;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            max-width: 500px;
            width: 100%;
            margin: 0 auto;
            background: white;
            padding: 24px;
            border-radius: 24px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.06);
        }
        h1 {
            font-weight: 800;
            font-size: 22px;
            color: #1a2940;
            text-align: center;
            margin-bottom: 4px;
        }
        h1 span {
            color: #dc2626;
        }
        label {
            display: block;
            margin-top: 16px;
            font-weight: 600;
            color: #1e293b;
            font-size: 14px;
        }
        input, select, textarea {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #e2e8f0;
            border-radius: 14px;
            font-size: 15px;
            font-family: 'Vazirmatn', sans-serif;
            box-sizing: border-box;
            margin-top: 6px;
            background: #f8fafc;
            transition: all 0.15s ease;
            -webkit-appearance: none;
            appearance: none;
        }
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #d4af37;
            background: white;
            box-shadow: 0 0 0 4px rgba(212, 175, 55, 0.1);
        }
        textarea {
            resize: vertical;
            min-height: 80px;
        }
        input[type="file"] {
            padding: 12px;
            font-size: 14px;
        }
        .btn {
            width: 100%;
            padding: 14px;
            background: #dc2626;
            color: white;
            border: none;
            border-radius: 16px;
            font-size: 17px;
            font-weight: 700;
            font-family: 'Vazirmatn', sans-serif;
            margin-top: 20px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(220, 38, 38, 0.2);
        }
        .btn:hover {
            background: #b91c1c;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(220, 38, 38, 0.25);
        }
        .back-link {
            display: inline-block;
            margin-top: 14px;
            color: #64748b;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: 0.15s ease;
        }
        .back-link:hover {
            color: #1a2940;
        }
        .alert {
            padding: 12px 16px;
            border-radius: 12px;
            margin: 12px 0;
            font-size: 14px;
            font-weight: 500;
        }
        .alert-success {
            background: #ecfdf5;
            color: #0d9488;
            border-right: 4px solid #0d9488;
        }
        .alert-danger {
            background: #fef2f2;
            color: #dc2626;
            border-right: 4px solid #dc2626;
        }
        .file-info {
            font-size: 12px;
            color: #94a3b8;
            margin-top: 4px;
        }
        .file-info a {
            color: #0d9488;
            text-decoration: none;
        }
        .file-info a:hover {
            text-decoration: underline;
        }
        @media (max-width: 600px) {
            body { padding: 10px; }
            .container { padding: 16px; border-radius: 18px; }
            h1 { font-size: 19px; }
            input, select, textarea { font-size: 14px; padding: 10px 12px; }
            .btn { font-size: 15px; padding: 12px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>{{ action }} <span>خرج</span></h1>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <div class="alert alert-{{ category }}">{{ message }}</div>
            {% endfor %}
        {% endwith %}

        <form method="POST" enctype="multipart/form-data">
            <label>توضیحات خرج</label>
            <textarea name="description" rows="3" required>{{ expense.description if expense else '' }}</textarea>

            <label>مبلغ (تومان)</label>
            <input type="number" name="amount" value="{{ expense.amount if expense else '' }}" required>

            <label>دسته (اختیاری)</label>
            <select name="category">
                <option value="">بدون دسته...</option>
                <option value="صدقه" {% if expense and expense.category == 'صدقه' %}selected{% endif %}>صدقه</option>
                <option value="خیرات" {% if expense and expense.category == 'خیرات' %}selected{% endif %}>خیرات</option>
                <option value="زکات" {% if expense and expense.category == 'زکات' %}selected{% endif %}>زکات</option>
                <option value="نذر" {% if expense and expense.category == 'نذر' %}selected{% endif %}>نذر</option>
                <option value="کمک عمومی" {% if expense and expense.category == 'کمک عمومی' %}selected{% endif %}>کمک عمومی</option>
            </select>

            <label>کمپین ویژه (اختیاری)</label>
            <select name="campaign_id">
                <option value="">بدون کمپین...</option>
                {% for camp in campaigns %}
                    <option value="{{ camp.id }}" {% if expense and expense.campaign_id == camp.id %}selected{% endif %}>{{ camp.title }}</option>
                {% endfor %}
            </select>

            <label>تصویر فیش (اختیاری)</label>
            <input type="file" name="receipt" accept="image/*">
            {% if expense and expense.receipt_image %}
                <div class="file-info">فیش قبلی: <a href="/static/uploads/{{ expense.receipt_image }}" target="_blank">مشاهده</a></div>
            {% endif %}

            <button type="submit" class="btn">💾 ذخیره خرج</button>
        </form>

        <a href="{{ url_for('dashboard') }}" class="back-link">← بازگشت به داشبورد</a>
    </div>
</body>
</html>
